name: UI Quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Run complete WFM and Schedule Intelligence validation
        run: npm run check

      - name: Validate HTML structure
        run: python -c "from html.parser import HTMLParser; from pathlib import Path; HTMLParser().feed(Path('index.html').read_text(encoding='utf-8')); print('index.html HTML parser OK')"
